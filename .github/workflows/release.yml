name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build ID Card Print (Windows)
      run: |
        mkdir dist
        cd dist
        rc /fo app.res ../src/app.rc
        cl /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE ../src/main_win.cpp app.res /Fe:IDCardPrint.exe /link user32.lib gdi32.lib comdlg32.lib comctl32.lib gdiplus.lib ole32.lib shell32.lib /SUBSYSTEM:WINDOWS
      shell: cmd

    - name: Upload Windows Artifact
      uses: softprops/action-gh-release@v1
      with:
        files: dist/IDCardPrint.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev build-essential

    - name: Build ID Card Print (Linux)
      run: |
        chmod +x build/build.sh
        cd build
        ./build.sh

    - name: Upload Linux Artifact
      uses: softprops/action-gh-release@v1
      with:
        files: build/bin/IDCardPrint
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
